<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PocketPilot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon set (Lucide-style, 2px stroke). Used with <svg><use href="#i-name"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect width="12" height="12" x="6" y="6" rx="2"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></symbol>
      <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="m18 9-6 6M12 9l6 6"/></symbol>
      <symbol id="i-enter" viewBox="0 0 24 24"><path d="m9 10-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="m5 9-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
      <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
      <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16ZM5 19V5"/></symbol>
      <symbol id="i-playpause" viewBox="0 0 24 24"><path d="M4 5v14l9-7-9-7ZM16 5v14M20 5v14"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4ZM19 5v14"/></symbol>
      <symbol id="i-switch" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
      <symbol id="i-desktop" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-windows" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect width="16" height="11" x="4" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
    </defs>
  </svg>

  <header class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg class="i"><use href="#i-logo"/></svg></span>
      <span class="name">PocketPilot</span>
    </div>
    <div class="conn" aria-live="polite">
      <span id="dot" class="dot wait" aria-hidden="true"></span>
      <span id="status" class="status">Connecting…</span>
      <span id="lag" class="lag" title="Round-trip time to the laptop"></span>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
      <svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg>
    </button>
  </header>

  <main id="pad" class="pad" aria-label="Touchpad">
    <div id="glow" class="glow" aria-hidden="true"></div>
    <div id="bubble" class="bubble" role="status" aria-live="polite" hidden></div>
    <div id="gesture" class="gesture" aria-hidden="true"></div>
    <div class="hint" id="hint">
      <p><b>1 finger</b> move · <b>tap</b> click · <b>tap, then hold</b> drag</p>
      <p><b>2 fingers</b> scroll · <b>tap</b> right-click · <b>pinch</b> zoom</p>
      <p><b>3 fingers</b> ← → switch apps · ↑ all windows · ↓ desktop</p>
    </div>
  </main>

  <section class="quick" aria-label="Shortcuts">
    <button class="chip-btn" data-hotkey="app_next"><svg class="i" aria-hidden="true"><use href="#i-switch"/></svg><span>Switch</span></button>
    <button class="chip-btn" data-hotkey="show_desktop"><svg class="i" aria-hidden="true"><use href="#i-desktop"/></svg><span>Desktop</span></button>
    <button class="chip-btn" data-hotkey="task_view"><svg class="i" aria-hidden="true"><use href="#i-windows"/></svg><span>Windows</span></button>
    <button class="chip-btn" data-hotkey="copy"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span>Copy</span></button>
    <button class="chip-btn" data-hotkey="paste"><svg class="i" aria-hidden="true"><use href="#i-paste"/></svg><span>Paste</span></button>
  </section>

  <section class="mouse-buttons" aria-label="Mouse buttons">
    <button class="mbtn" data-button="left" aria-label="Left mouse button"><span>L</span></button>
    <button class="mbtn" data-button="right" aria-label="Right mouse button"><span>R</span></button>
  </section>

  <section class="voice" aria-label="Voice and commands">
    <button id="micBtn" class="mic" aria-label="Hold to talk, slide right to lock">
      <svg class="i" aria-hidden="true"><use href="#i-mic"/></svg>
    </button>
    <div id="recBar" class="rec-bar" role="status" aria-live="polite" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span id="recTime" class="rec-time">0:00</span>
      <span id="recHint" class="rec-hint">→ lock  ·  ← cancel</span>
      <svg class="i rec-lock" aria-hidden="true"><use href="#i-lock"/></svg>
    </div>
    <form id="cmdForm" class="cmd" autocomplete="off">
      <button id="langBtn" type="button" class="lang" aria-label="Voice language: English. Tap for Telugu">EN</button>
      <input id="cmdText" type="text" maxlength="300" placeholder="Type a command…" enterkeyhint="send" aria-label="Command">
      <button class="send" aria-label="Send command"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
    </form>
    <button id="stopBtn" class="stop" aria-label="Stop everything">
      <svg class="i" aria-hidden="true"><use href="#i-stop"/></svg>
    </button>
  </section>

  <section class="row keys" aria-label="Keys">
    <button id="kbdBtn" class="key wide" aria-label="Keyboard"><svg class="i" aria-hidden="true"><use href="#i-keyboard"/></svg><span>Type</span></button>
    <button class="key" data-key="esc">Esc</button>
    <button class="key" data-key="tab">Tab</button>
    <button class="key" data-key="backspace" aria-label="Backspace"><svg class="i" aria-hidden="true"><use href="#i-backspace"/></svg></button>
    <button class="key" data-key="enter" aria-label="Enter"><svg class="i" aria-hidden="true"><use href="#i-enter"/></svg></button>
    <button id="arrowsBtn" class="key" aria-label="Arrow keys" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-move"/></svg></button>
  </section>

  <section id="arrows" class="row arrows" aria-label="Arrow keys" hidden>
    <button class="key" data-key="left" aria-label="Left arrow"><svg class="i" aria-hidden="true"><use href="#i-left"/></svg></button>
    <button class="key" data-key="up" aria-label="Up arrow"><svg class="i" aria-hidden="true"><use href="#i-up"/></svg></button>
    <button class="key" data-key="down" aria-label="Down arrow"><svg class="i" aria-hidden="true"><use href="#i-down"/></svg></button>
    <button class="key" data-key="right" aria-label="Right arrow"><svg class="i" aria-hidden="true"><use href="#i-right"/></svg></button>
  </section>

  <section class="row media" aria-label="Media">
    <button class="key" data-media="volume_down" aria-label="Volume down"><svg class="i" aria-hidden="true"><use href="#i-vol-down"/></svg></button>
    <button class="key" data-media="mute" aria-label="Mute"><svg class="i" aria-hidden="true"><use href="#i-mute"/></svg></button>
    <button class="key" data-media="volume_up" aria-label="Volume up"><svg class="i" aria-hidden="true"><use href="#i-vol-up"/></svg></button>
    <button class="key" data-media="prev" aria-label="Previous track"><svg class="i" aria-hidden="true"><use href="#i-prev"/></svg></button>
    <button class="key" data-media="play_pause" aria-label="Play or pause"><svg class="i" aria-hidden="true"><use href="#i-playpause"/></svg></button>
    <button class="key" data-media="next" aria-label="Next track"><svg class="i" aria-hidden="true"><use href="#i-next"/></svg></button>
  </section>

  <!-- Off-screen box that brings up the phone keyboard -->
  <input id="kbd" class="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type on laptop">

  <dialog id="settings" class="sheet">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="slider">Pointer speed <output id="sensOut"></output>
        <input id="sens" type="range" min="0.4" max="3" step="0.1">
      </label>
      <label class="slider">Acceleration <output id="accelOut"></output>
        <input id="accel" type="range" min="0" max="2" step="0.1">
      </label>
      <label class="slider">Scroll speed <output id="scrollOut"></output>
        <input id="scroll" type="range" min="0.3" max="3" step="0.1">
      </label>
      <label class="switch"><span>Tap, then hold to drag<small>Double-tap = double-click. Taps wait a moment for a second tap.</small></span><input id="tapdrag" type="checkbox"></label>
      <label class="switch"><span>Natural scrolling<small>Content follows your fingers</small></span><input id="natural" type="checkbox"></label>
      <label class="switch"><span>Speak replies out loud</span><input id="speak" type="checkbox"></label>
      <label class="switch"><span>Show gesture hints</span><input id="hints" type="checkbox"></label>
      <button class="primary">Done</button>
    </form>
  </dialog>

  <dialog id="chooseDlg" class="sheet choose">
    <h2 id="chooseTitle">Which one?</h2>
    <div id="chooseList" class="choose-list"></div>
    <button id="chooseCancel" type="button" class="secondary">Cancel</button>
  </dialog>

  <dialog id="approveDlg" class="sheet approve">
    <div class="approve-icon" aria-hidden="true"><svg class="i"><use href="#i-shield"/></svg></div>
    <h2>Approve?</h2>
    <p id="approveText"></p>
    <p id="approveTimer" class="muted"></p>
    <div class="approve-row">
      <button id="denyBtn" type="button" class="secondary">Cancel</button>
      <button id="okBtn" type="button" class="primary">Approve</button>
    </div>
  </dialog>

  <script src="touchpad.js"></script>
  <script src="voice.js"></script>
</body>
</html>
